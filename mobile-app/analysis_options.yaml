analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    # build_runner ürettiği dosyalar — lint kapsamı dışı
    - "**/*.g.dart"
    - "**/*.freezed.dart"

include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Türkçe metin sabitleri zorunlu (AGENTS.md §4)
    prefer_const_constructors: true
    prefer_const_declarations: true
    # Boş catch bloğu yasak (AGENTS.md §4)
    empty_catches: true
    # Yorum gereksizse kalmasın
    avoid_redundant_argument_values: true
    prefer_single_quotes: true
