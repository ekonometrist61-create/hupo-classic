analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    # Yerel paketler kendi pubspec'iyle analiz edilir: `cd packages/okuma_motoru; dart test; dart analyze`.
    - packages/**
    # build_runner ürettiği dosyalar — lint kapsamı dışı
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    # Paketleri (google_mobile_ads, firebase_*) pubspec'te olmayan, hiçbir yerden
    # import edilmeyen iki dosya. Silinmedi; Firebase / AdMob kurulunca geri alınır
    # (TASKS.md §11.5, karar: analiz dışına al).
    - lib/ads/student_banner_ad.dart

include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Türkçe metin sabitleri zorunlu (AGENTS.md §4)
    prefer_const_constructors: true
    prefer_const_declarations: true
    # Boş catch bloğu yasak (AGENTS.md §4)
    empty_catches: true
    # Yorum gereksizse kalmasın
    avoid_redundant_argument_values: true
    prefer_single_quotes: true
