name: ogrenci_hazirlik
description: Öğrenci Hazırlık Uygulaması - öğrenci arayüzü (soru çözme, XP, seri, aralıklı tekrar).
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.4.10
  supabase_flutter: ^2.17.2
  lottie: ^3.6.1
  shared_preferences: ^2.5.5

  # ── Güvenlik ────────────────────────────────────────────────────────────
  # Supabase JWT token'ını SharedPreferences yerine Android Keystore /
  # iOS Keychain'de saklar. minSdk 23 gerektirir (bkz. build.gradle.kts).
  flutter_secure_storage: ^9.2.4

  # ── Ses efektleri ────────────────────────────────────────────────────────
  # Gamification SFX: doğru cevap, XP, level-up, karakter açılımı vb.
  audioplayers: ^6.1.0

  # ── Yardımcı ────────────────────────────────────────────────────────────
  # Gizlilik politikası, veli izin formu ve harici bağlantılar için.
  url_launcher: ^6.3.1
  # Bakım kapısında min_surum kontrolü için cihaz sürüm bilgisi.
  package_info_plus: ^8.3.0

  sentry_flutter: 10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # ── Lint ────────────────────────────────────────────────────────────────
  # Riverpod en iyi pratiklerini zorlar (ref.watch yanlış yerde, vb.).
  custom_lint: ^0.7.1
  riverpod_lint: ^2.6.1

flutter:
  uses-material-design: true

  # Flutter alt klasörleri kendiliğinden taramaz; her klasör ayrı yazılır.
  assets:
    - assets/hupo/
    - assets/hupo/ifade/
    - assets/hupo/uygulama/
    - assets/lottie/
    - assets/characters/ozgur_ruhlar/
    - assets/characters/firtina/
    - assets/characters/kasifler/
    - assets/characters/bozkir/
    - assets/characters/zihin_ustalari/
    - assets/characters/muhafizlar/
    - assets/characters/ustalar/
    - assets/characters/efsaneler/
    - assets/audio/brand/
    - assets/audio/learning/
    - assets/audio/progression/
    - assets/audio/rewards/
    - assets/audio/rarity/
    - assets/nav/
    - assets/fonts/Nunito-OFL.txt
    - assets/fonts/Lexend-OFL.txt

  fonts:
    # Nunito (SIL OFL 1.1): yuvarlak hatlı, çocuk dostu; Türkçe karakterleri tam destekler.
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
    # Lexend (SIL OFL 1.1): harf aralığı geniş, okumayı kolaylaştıran seçenek.
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend.ttf
