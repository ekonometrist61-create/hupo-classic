name: ogrenci_hazirlik
description: Öğrenci Hazırlık Uygulaması - öğrenci arayüzü (soru çözme, XP, seri, aralıklı tekrar).
publish_to: "none"

version: 1.3.0+5

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.4.10
  supabase_flutter: ^2.17.2
  lottie: ^3.6.1
  shared_preferences: ^2.5.5

  # Okuma Dünyası ("Senin Hikâyen"): saf Dart motoru (ad çekimi + hikâye çözücü).
  okuma_motoru:
    path: packages/okuma_motoru
  # PDF yalnız ertelenmiş yüklemeyle (deferred import) kullanılır: ana paketi büyütmez.
  pdf: ^3.13.1
  printing: ^5.15.1

  # ── Güvenlik ────────────────────────────────────────────────────────────
  # Supabase JWT token'ını SharedPreferences yerine Android Keystore /
  # iOS Keychain'de saklar. minSdk 23 gerektirir (bkz. build.gradle.kts).
  flutter_secure_storage: ^9.2.4

  # ── Ses efektleri ────────────────────────────────────────────────────────
  # Gamification SFX: doğru cevap, XP, level-up, karakter açılımı vb.
  audioplayers: ^6.1.0

  # ── Yardımcı ────────────────────────────────────────────────────────────
  # Gizlilik politikası, veli izin formu ve harici bağlantılar için.
  url_launcher: ^6.3.1
  # Bakım kapısında min_surum kontrolü için cihaz sürüm bilgisi.
  package_info_plus: ^8.3.0

  sentry_flutter: 10.0.0
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter_svg: ^2.3.0
  file_saver: 0.7.0
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # ── Lint ────────────────────────────────────────────────────────────────
  # Riverpod en iyi pratiklerini zorlar (ref.watch yanlış yerde, vb.).
  custom_lint: ^0.7.1
  riverpod_lint: ^2.6.1

flutter:
  uses-material-design: true

  # Flutter alt klasörleri kendiliğinden taramaz; her klasör ayrı yazılır.
  assets:
    - assets/hupo/
    - assets/hupo/ifade/
    - assets/hupo/uygulama/
    - assets/lottie/
    - assets/characters/ozgur_ruhlar/
    - assets/characters/firtina/
    - assets/characters/kasifler/
    - assets/characters/bozkir/
    - assets/characters/zihin_ustalari/
    - assets/characters/muhafizlar/
    - assets/characters/ustalar/
    - assets/characters/efsaneler/
    - assets/audio/brand/
    - assets/audio/learning/
    - assets/audio/progression/
    - assets/audio/rewards/
    - assets/audio/rarity/
    - assets/nav/
    - assets/okuma/
    - assets/okuma/karakterler/
    - assets/okuma/ikonlar/
    - assets/fonts/Nunito-OFL.txt
    - assets/fonts/Lexend-OFL.txt
    # Senin Hikâyen PDF'i için Nunito'nun statik normal ve kalın örnekleri (kaynak: NunitoPdf-KAYNAK.txt).
    - assets/fonts/NunitoPdf-Regular.ttf
    - assets/fonts/NunitoPdf-Bold.ttf
    # Senin Hikâyen PDF'i kitap gövdesi: Literata (SIL OFL 1.1; kaynak: LiterataPdf-KAYNAK.txt).
    - assets/fonts/LiterataPdf-Regular.ttf
    - assets/fonts/LiterataPdf-Bold.ttf
    - assets/fonts/Literata-OFL.txt
    - assets/fonts/LiterataPdf-KAYNAK.txt
    # Genel semantik ikon kütüphanesi (89 kavram × renkli/sade SVG). Katalog: tool/ikon_katalogu_uret.dart.
    - assets/okuma/hikaye_ikonlari/
    - assets/okuma/sahneler/
    - assets/okuma/vitrin/
    - assets/okuma/kahramanlar/

  fonts:
    # Nunito (SIL OFL 1.1): yuvarlak hatlı, çocuk dostu; Türkçe karakterleri tam destekler.
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
    # Lexend (SIL OFL 1.1): harf aralığı geniş, okumayı kolaylaştıran seçenek.
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend.ttf
